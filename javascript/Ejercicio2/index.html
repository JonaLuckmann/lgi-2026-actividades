<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estudiantes</title>

    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <main>
      <h1>Estudiantes</h1>

      <section aria-labelledby="tituloNuevo">
        <h2 id="tituloNuevo">Agregar estudiante</h2>
        <form id="formularioEstudiante">
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            maxlength="100"
            required
          />

          <fieldset>
            <legend>Notas (0 a 10)</legend>
            <div>
              <label for="nota1">Nota 1</label>
              <input
                id="nota1"
                name="notas[]"
                type="number"
                min="0"
                max="10"
                step="0.1"
                required
              />
            </div>
            <div>
              <label for="nota2">Nota 2</label>
              <input
                id="nota2"
                name="notas[]"
                type="number"
                min="0"
                max="10"
                step="0.1"
                required
              />
            </div>
            <div>
              <label for="nota3">Nota 3</label>
              <input
                id="nota3"
                name="notas[]"
                type="number"
                min="0"
                max="10"
                step="0.1"
                required
              />
            </div>
          </fieldset>

          <button type="submit">Agregar</button>
        </form>
        <p id="mensaje" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="tituloLista">
        <h2 id="tituloLista">Listado</h2>
        <label for="buscador">Buscar por nombre</label>
        <input id="buscador" type="search" placeholder="Escribe un nombre" />

        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Promedio</th>
                <th scope="col">Estado</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaEstudiantes"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="modalEdicion" aria-labelledby="tituloEdicion">
      <h2 id="tituloEdicion">Editar estudiante</h2>
      <form id="formularioEdicion">
        <label for="nombreEdicion">Nombre</label>
        <input
          id="nombreEdicion"
          name="nombre"
          type="text"
          maxlength="100"
          required
        />

        <fieldset>
          <legend>Notas (0 a 10)</legend>
          <div>
            <label for="notaEdicion1">Nota 1</label>
            <input
              id="notaEdicion1"
              name="notas[]"
              type="number"
              min="0"
              max="10"
              step="0.1"
              required
            />
          </div>
          <div>
            <label for="notaEdicion2">Nota 2</label>
            <input
              id="notaEdicion2"
              name="notas[]"
              type="number"
              min="0"
              max="10"
              step="0.1"
              required
            />
          </div>
          <div>
            <label for="notaEdicion3">Nota 3</label>
            <input
              id="notaEdicion3"
              name="notas[]"
              type="number"
              min="0"
              max="10"
              step="0.1"
              required
            />
          </div>
        </fieldset>

        <div class="acciones-modal">
          <button type="submit">Guardar cambios</button>
          <button id="cancelarEdicion" class="boton-secundario" type="button">
            Cancelar
          </button>
        </div>
        <p id="mensajeEdicion" role="status" aria-live="polite"></p>
      </form>
    </dialog>

    <script src="js/app.js"></script>
  </body>
</html>
